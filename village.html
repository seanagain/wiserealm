<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1446">
<title>WiseRealm · Village</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<section class="screen village-page active">
  <div class="topbar">
    <div class="logo">Wise<span>Realm</span> <span class="muted" style="font-size:.8rem">Village</span></div>
    <div class="flex">
      <a class="btn primary" href="house.html" id="myHouseBtn">🏠 Decorate my house</a>
      <a class="btn" href="me.html" id="profileBtn">My profile</a>
      <a class="btn" href="index.html">Play ▶</a>
    </div>
  </div>
  <div id="previewBanner" class="banner" hidden>🧪 Preview mode: the neighbors here are pretend, so you can try the village out.</div>
  <div id="gate" class="card" style="padding:18px" hidden>
    <h2 style="margin-top:0">Sign in to visit your class village</h2>
    <p class="muted">Use your school Google account. Each class has its own village with a house for every classmate.</p>
    <button class="btn primary big" id="signIn">Sign in with Google</button>
    <p id="gateErr" style="color:var(--bad)"></p>
  </div>
  <div id="main" hidden>
    <div class="tabs" id="classTabs"></div>
    <div class="village" id="village"></div>
  </div>
</section>
<dialog id="visit" class="visit-dialog">
  <div class="flex" style="align-items:center"><h2 style="margin:0;flex:1" id="visitTitle"></h2><button class="btn small" id="visitClose">Close ✕</button></div>
  <div class="visit-room" id="visitRoom"></div>
  <p class="muted" id="visitNote" style="margin:0"></p>
</dialog>
<script type="module" src="js/village.js"></script>
</body>
</html>
