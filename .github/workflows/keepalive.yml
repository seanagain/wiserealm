# Keeps the free Supabase project from pausing (it pauses after ~7 days with no activity).
# Every 3 days this reads one row from the tiny `keepalive` table. See README.md → "Keep-awake ping".
# If the ping ever fails, GitHub emails the repo owner, so you'll know before class.
name: Supabase keep-awake ping

on:
  schedule:
    - cron: '17 14 */3 * *' # every 3 days at 14:17 UTC
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  actions: write # so the workflow can keep itself switched on (GitHub disables idle schedules after 60 days)
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping Supabase
        run: |
          # Read the public URL and publishable key straight from the site's config so they never get out of sync.
          URL=$(grep -oP "SUPABASE_URL:\s*'\K[^']+" js/config.js)
          KEY=$(grep -oP "SUPABASE_ANON_KEY:\s*'\K[^']+" js/config.js)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "Supabase is not configured in js/config.js"; exit 1; fi
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --max-time 30 \
                 -H "apikey: $KEY" \
                 "$URL/rest/v1/keepalive?select=id&limit=1"; then
              echo; echo "Supabase is awake."; exit 0
            fi
            echo "Attempt $attempt failed; retrying in 60s..."; sleep 60
          done
          echo "::error::Could not reach Supabase. Is the project paused, or is the keepalive table missing?"
          exit 1

      - name: Keep this schedule switched on
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
